[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab-course-study"
version = "0.1.0"
description = "Unpublished, bounded A-share factor research"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "pyarrow==18.1.0", "scipy==1.15.0", "matplotlib==3.10.0", "PyYAML==6.0.3", "baostock==0.9.4", "requests==2.34.2"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
reading = ["PyMuPDF==1.25.2", "Pillow==11.1.0"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
