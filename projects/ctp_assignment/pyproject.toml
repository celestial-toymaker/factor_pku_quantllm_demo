[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lesson02-ctp-assignment"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Bounded SimNow course exercise with durable reconciliation"
dependencies = []

[project.scripts]
ctp-assignment = "ctp_assignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

